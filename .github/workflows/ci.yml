name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc (required by lance build scripts)
        run: command -v protoc >/dev/null 2>&1 || brew install protobuf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      # TypeScript validates source content against this file, so it remains
      # correct when source changes while avoiding a full graph rebuild on
      # subsequent CI runs with the same dependency and compiler setup.
      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: typescript-build-info-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json', 'tsconfig.node.json') }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # The Foundation Models helper is deterministic for a given Swift
      # manifest. Cache its build products so pnpm's postinstall hook can
      # reuse them, while still rebuilding whenever its source is newer.
      # Keep PDFium out of this cache: fetch-pdfium.sh deliberately tracks the
      # publisher's latest binary on every clean runner.
      - name: Cache Foundation Models sidecar
        uses: actions/cache@v4
        with:
          path: |
            sidecar/alchemy-fm/.build
            src-tauri/binaries/alchemy-fm
            src-tauri/binaries/alchemy-fm.sha256
          key: fm-sidecar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sidecar/alchemy-fm/Package.swift', 'scripts/build-fm-sidecar.sh') }}

      - name: Install frontend dependencies
        # Postinstall fetches PDFium and builds the Swift FM sidecar. Both are
        # required even for `cargo clippy`: tauri.conf.json lists them as
        # bundle resources/externalBin, and Tauri's build script hard-fails
        # when a listed resource is missing (--ignore-scripts kept CI red
        # from the night-shift merge to v0.30.0).
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck + build
        run: pnpm build

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        # The crate has no Rust integration-test files or binary tests; all
        # executable coverage lives in the library test harness. Avoid
        # linking an empty second harness and running empty doc-tests.
        run: cargo test --lib
