[package]
name = "alchemy"
version = "0.53.0"
description = "Local-first research notebook inspired by NotebookLM — RAG over your sources, powered by Ollama"
authors = ["thrashr888"]
license = "MPL-2.0"
repository = "https://github.com/thrashr888/alchemy"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "alchemy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lancedb = "0.37.1"
tokio = { version = "1.52.3", features = ["full"] }
anyhow = "1.0.103"
thiserror = "2.0.18"
futures = "0.3.32"
uuid = { version = "1.23.4", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
arrow-array = "58"
arrow-schema = "58"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
base64 = "0.22"
# Single-pass multi-needle scan for the notebook link graph (graph.rs).
aho-corasick = "1"
pdfium-render = { version = "0.8", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
futures-util = "0.3.32"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tauri-plugin-debug-bridge = { version = "0.6", optional = true }
model2vec-rs = "0.2.1"
tokio-util = { version = "0.7.18", default-features = false }
# Readability-style article extraction for URL sources. Built on dom_query,
# which is already in the tree via tauri-utils.
dom_smoothie = "0.18"
csv = "1"
# Apple Notes/Reminders/Calendar/Stocks sources (mac.rs) — linked, not shelled
# out to, so users need no `brew install cider`. default-features = false
# drops its Clap CLI front-end. cider is Paul's repo: fix bugs there.
cider = { package = "cider-cli", version = "0.4", default-features = false }
percent-encoding = "2"
# Folder scanning for all folder sources (docs/RFC-git-sources.md): ripgrep's
# own walker — .gitignore/.ignore-aware, symlink-safe, prunes dot-dirs.
ignore = "0.4"
# FSEvents for open notebooks' folder sources (fswatch.rs, RFC-events §4).
notify = "6"
# Query-time exact-match retrieval leg over repo-backed sources — ripgrep's
# engine, in-process (RFC-git-sources §6).
grep-regex = "0.1"
grep-searcher = "0.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-window-state = "2.4.1"

# Embedded MCP server for agent access (see docs/RFC-mcp-server.md):
# official Rust MCP SDK + axum to host the streamable-HTTP transport.
rmcp = { version = "3.1", features = ["transport-streamable-http-server"] }
# Hosted agents (docs/RFC-acp-agents.md). Pinned to the 2.x minor: young crate,
# stable wire-protocol v1 only — do not enable unstable_protocol_v2.
agent-client-protocol = "2.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

# Tiny pure-Rust WAV reader/writer — stitches per-line TTS output into one
# Audio Overview episode (see tts.rs).
hound = "3"
# Kokoro-82M inference for Audio Overview voices: ort (ONNX) + misaki-rs G2P.
# default-features = false is load-bearing: the default `g2p-espeak` feature
# links espeak-ng, which is GPL-3.0 — without it the tree is Apache/MIT only
# (misaki's dictionary handles G2P). Model downloads on first use like the
# built-in embedder.
kokoro-en = { version = "0.1.5", default-features = false }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-global-shortcut = "2.3.2"
htmd = "0.5.4"
window-vibrancy = "0.8.0"
tauri-plugin-liquid-glass = "0.1.6"
# Keep the grammar set aligned with outline.rs::lang_for. The crate's
# builtin-parser feature enables every bundled grammar, including languages
# Alchemy never dispatches to, which needlessly expands clean Rust builds.
ast-grep-language = { version = "0.44.1", default-features = false, features = ["tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-go", "tree-sitter-ruby", "tree-sitter-java", "tree-sitter-swift", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-php", "tree-sitter-html", "tree-sitter-bash", "tree-sitter-hcl"] }
ast-grep-core = "0.44.1"
exif = { version = "0.6.1", package = "kamadak-exif" }

# Per-note export (docs/RFC-note-export.md). pulldown-cmark parses the note's
# markdown once for both writers (CommonMark + tables, zero-dep with default
# features off); docx-rs writes Word documents (pure Rust, no image feature —
# notes are text); rust_xlsxwriter writes spreadsheets for table notes.
pulldown-cmark = { version = "0.13", default-features = false }
docx-rs = { version = "0.4", default-features = false }
rust_xlsxwriter = "0.98"
pdf-inspector = "0.1.7"
anydoc = "0.1.7"
fastembed = { version = "5.17.4", default-features = false, features = ["ort-download-binaries", "hf-hub-native-tls"] }

# Already in the tree via tauri/wry — traffic-light insets, the Services
# provider (services.rs), and Spotlight indexing (spotlight.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-spotlight = "0.3"
block2 = "0.6"

[dev-dependencies]
# pptx tests only: well-formedness check over the hand-rolled OOXML parts.
# Already in the dependency tree via docx-rs, so this costs nothing new.
quick-xml = "0.41"

[features]
# Dev-only: exposes the debug bridge for CLI automation/inspection.
debug = ["dep:tauri-plugin-debug-bridge"]

# Faster dev builds: keep file:line for our own code (line-tables) but skip
# debuginfo for the heavy dependency tree (lance/arrow/datafusion), which is
# the bulk of compile + link time and target size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Tests use the same heavy dependency graph as development builds, but do not
# need debug symbols. Omitting them keeps test compilation and linking from
# carrying the full Lance/Arrow/DataFusion tree.
[profile.test]
debug = 0

[profile.test.package."*"]
debug = false
